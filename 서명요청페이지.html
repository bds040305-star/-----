<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서명 요청 하기</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .signature-pad {
      width: 100%;
      height: 180px;
      background: #f8fafc;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
    }
  </style>
</head>
<body>



  <div class="content">
    <span style="background: #e0f2fe; color: var(--primary-blue); font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: bold;">서명 요청 중</span>
    <h2 style="margin-top: 8px; font-size: 18px;">서명 요청 하기</h2>
    <p style="font-size: 16px; color: var(--point-green); font-weight: bold; margin-top: 2px;">김도윤 님이 서명을 요청했어요</p>
    <p style="font-size: 11px; color: #888; margin-top: 4px;">가족관계증명서 1곳 서명 필요</p>

    <div style="background: #f1f5f9; padding: 20px; border-radius: 12px; text-align: center; margin: 20px 0; color: #666; font-weight: bold;">
      서류 미리보기
    </div>

    <p style="font-size: 13px; font-weight: bold;">아래 칸에 손가락으로 서명해주세요</p>
    <div class="signature-pad">
      <span>서명란</span>
    </div>
    <p style="font-size: 9px; color: #aaa; margin-top: 6px;">※서명 정보는 저장되지 않고 즉시 삭제돼요</p>
  </div>

  <div style="padding: 16px; background: #fff;">
    <a href="application-status.html" class="btn-primary">서명 완료</a>
  </div>
</div>

</body>
</html>
